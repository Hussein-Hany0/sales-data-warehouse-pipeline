
version: 2

models:
  - name: fact_sales
    description: "Gold fact table for sales analytics"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: order_date
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null
