
services:
  postgres:
    image: postgres:16
    container_name: dw_postgres
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: dw_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_user -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: dw_airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://dw_user:${POSTGRES_PASSWORD}@postgres:5432/warehouse
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/dbt_profiles:/opt/airflow/.dbt
      - ./sales_warehouse:/opt/airflow/dbt/sales_warehouse
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: dw_airflow_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler

volumes:
  postgres_data:
